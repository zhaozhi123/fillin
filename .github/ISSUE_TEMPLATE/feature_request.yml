name: Feature request
description: Suggest an improvement to Fillin
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy and permission impact
      description: Note any new data flow, external request, host access, or Chrome permission.
    validations:
      required: true
